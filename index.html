<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無人島生存</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #eee; font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif; overflow: hidden; }
    #game-canvas { display: block; width: 100vw; height: 100vh; background: #0f0f1a; }
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 1rem; }
    .spinner { width: 48px; height: 48px; border: 4px solid #333; border-top-color: #4ecdc4; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>載入中...</p>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
